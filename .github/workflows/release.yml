name: Release

# Publishes compiled releases, with no tag to create by hand:
#
# - every merge into main  → a numbered release vX.Y.Z, created by this
#   workflow: the version of Cargo.toml if it has no release yet, otherwise
#   the last release + 1 on the patch number (raise the version in
#   Cargo.toml to move to a new minor or major); documentation-only merges
#   publish nothing;
# - "Run workflow" button   → a numbered release vX.Y.Z (the version typed,
#   or the one in Cargo.toml);
# - a pushed tag v*         → that numbered release (optional).
#
# Every release carries the three server binaries, the Android library and
# SHA256SUMS, signed keylessly with Sigstore cosign (GitHub OIDC): anyone can
# check the files were built by this workflow, and rebuild the Linux
# binaries byte for byte (scripts/verify-release.sh).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. 0.2.0 (vide : celle de Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      title: ${{ steps.p.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the existing tags, to number the release
      - id: p
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          cargo_v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="${INPUT_VERSION#v}"
            [ -n "$v" ] || v="$cargo_v"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # Merge into main: next version after the last numbered release.
            last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            last="${last#v}"; last="${last%%[-+]*}"
            if [ -z "$last" ] || [ "$(printf '%s\n%s\n' "$last" "$cargo_v" | sort -V | tail -1)" != "$last" ]; then
              v="$cargo_v"
            else
              IFS=. read -r ma mi pa <<< "$last"
              v="$ma.$mi.$((pa + 1))"
            fi
          fi
          echo "$v" | grep -Eq "$semver" || { echo "version invalide : $v"; exit 1; }
          tag="v$v"
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "la release $tag existe déjà"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=harpochat $tag" >> "$GITHUB_OUTPUT"
          echo "→ harpochat $tag (commit ${GITHUB_SHA:0:7})"

  server:
    name: server ${{ matrix.artifact }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: harpochat-server-windows-x86_64.exe
            zig: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: harpochat-server-linux-x86_64
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: harpochat-server-linux-aarch64
            zig: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Reproducibility settings
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        run: |
          pip3 install --user ziglang==0.13.0
          cargo install cargo-zigbuild --locked
      - name: Build (musl, static, reproducible)
        if: matrix.zig
        run: scripts/build-release.sh ${{ matrix.target }}
      - name: Build (Windows, static CRT)
        if: ${{ !matrix.zig }}
        shell: bash
        env:
          # /Brepro: no link timestamp in the PE header (deterministic output).
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/Brepro --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=C:/Users/runneradmin/.cargo=/cargo"
        run: cargo build --release --locked -p harpochat-server --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/harpochat-server
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p dist && cp "$src" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  android:
    name: android library
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build .so (NDK preinstalled on the runner)
        env:
          # No build path in the .so (panic locations): neither the runner's
          # directories nor the crate names, which name the app.
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=.
            --remap-path-prefix=/home/runner/.cargo=/cargo
            --remap-path-prefix=crates/harpochat-core=core
            --remap-path-prefix=crates/harpochat-core-ffi=ffi
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 28 \
            -o dist/jniLibs build --release --locked -p harpochat-core-ffi
      - name: Discretion check (the .so must not name the app)
        # Only the protocol's domain-separation labels may remain (spec §5).
        run: |
          for so in dist/jniLibs/*/libcorekit.so; do
            n=$(grep -aoi harpochat "$so" | wc -l)
            echo "$so: $n"
            [ "$n" -le 10 ] || { grep -aoi '[a-z_./-]*harpochat[a-z_./-]*' "$so" | sort | uniq -c; exit 1; }
          done
      - name: Kotlin bindings and archive
        # Generated from an unstripped host build (the release .so are stripped).
        run: |
          cargo build --locked -p harpochat-core-ffi --lib
          cargo run --locked -p harpochat-core-ffi --features cli --bin uniffi-bindgen -- \
            generate --library target/debug/libcorekit.so \
            --language kotlin --no-format --out-dir dist/kotlin
          mkdir -p dist/test-vectors && cp crates/harpochat-core/test-vectors/v1.json dist/test-vectors/
          (cd dist && zip -qr ../harpochat-core-android.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: harpochat-core-android.zip
          path: harpochat-core-android.zip
          if-no-files-found: error

  publish:
    name: checksums, signature, release
    needs: [plan, server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum harpochat-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
        run: |
          cat > notes.md <<EOF
          Compilé depuis le commit ${GITHUB_SHA} par ce workflow.

          | Fichier | Pour |
          |---|---|
          | \`harpochat-server-windows-x86_64.exe\` | nœud, Windows 64 bits |
          | \`harpochat-server-linux-x86_64\` | nœud, Linux 64 bits (PC, VPS) |
          | \`harpochat-server-linux-aarch64\` | nœud, Linux ARM 64 bits (Raspberry Pi 4/5) |
          | \`harpochat-core-android.zip\` | app Android : .so (3 ABI), bindings Kotlin, vecteurs de test |

          Vérification : \`SHA256SUMS\` est signé par Sigstore, voir docs/operators/install.md,
          ou \`scripts/verify-release.sh ${TAG}\` (signature + recompilation à l'identique).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file notes.md --generate-notes --latest
          # The former rolling pre-release "latest" is replaced by these
          # numbered releases: remove it if it is still there.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
