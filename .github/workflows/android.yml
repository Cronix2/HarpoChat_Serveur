name: Android core

# Builds harpochat-core-ffi for the three Android ABIs and generates the
# Kotlin bindings on every pull request (artifact). Publication is done by
# the Release workflow, together with the server binaries.
#   harpochat-core-android.zip
#     jniLibs/{arm64-v8a,armeabi-v7a,x86_64}/libharpochat_core_ffi.so
#     kotlin/app/harpochat/core/harpochat_core_ffi.kt
#     test-vectors/v1.json

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build .so (NDK preinstalled on the runner)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o dist/jniLibs build --release --locked -p harpochat-core-ffi
          ls -lR dist/jniLibs
      - name: Kotlin bindings
        # Generated from an unstripped host build: the release .so are stripped
        # (strip = true), which removes uniffi's metadata but keeps the exported
        # symbols JNA needs.
        run: |
          cargo build --locked -p harpochat-core-ffi --lib
          cargo run --locked -p harpochat-core-ffi --features cli --bin uniffi-bindgen -- \
            generate --library target/debug/libharpochat_core_ffi.so \
            --language kotlin --no-format --out-dir dist/kotlin
          mkdir -p dist/test-vectors && cp crates/harpochat-core/test-vectors/v1.json dist/test-vectors/
          (cd dist && zip -r ../harpochat-core-android.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: harpochat-core-android
          path: harpochat-core-android.zip
          if-no-files-found: error
