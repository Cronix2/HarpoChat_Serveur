name: Android core

# Builds harpochat-core-ffi for the three Android ABIs and generates the
# Kotlin bindings. On a `core-v*` tag, publishes them as a release asset.
#   harpochat-core-android.zip
#     jniLibs/{arm64-v8a,armeabi-v7a,x86_64}/libharpochat_core_ffi.so
#     kotlin/app/harpochat/core/harpochat_core_ffi.kt
#     test-vectors/v1.json

on:
  push:
    branches: [main]
    tags: ["core-v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build .so (NDK preinstalled on the runner)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o dist/jniLibs build --release --locked -p harpochat-core-ffi
          ls -lR dist/jniLibs
      - name: Kotlin bindings
        run: |
          cargo run --locked -p harpochat-core-ffi --features cli --bin uniffi-bindgen -- \
            generate --library target/aarch64-linux-android/release/libharpochat_core_ffi.so \
            --language kotlin --no-format --out-dir dist/kotlin
          mkdir -p dist/test-vectors && cp crates/harpochat-core/test-vectors/v1.json dist/test-vectors/
          (cd dist && zip -r ../harpochat-core-android.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: harpochat-core-android
          path: harpochat-core-android.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harpochat-core-android
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum harpochat-core-android.zip > harpochat-core-android.zip.sha256
          gh release create "${GITHUB_REF_NAME}" harpochat-core-android.zip harpochat-core-android.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" --title "harpochat-core ${GITHUB_REF_NAME}" \
            --notes "Bibliothèques Android + bindings Kotlin. Voir docs/android/gradle-integration.md."
