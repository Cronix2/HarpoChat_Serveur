[workspace]
resolver = "2"
members = ["crates/harpochat-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
authors = ["HarpoChat contributors"]
repository = "https://github.com/Cronix2/HarpoChat_Serveur"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
ed25519-dalek = { version = "3", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
sphinx-packet = "0.8"
blake2 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
data-encoding = "2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
getrandom = "0.4"
thiserror = "2"
subtle = "2.6"
# dev
serde_json = "1"
hex = "0.4"
proptest = "1"

[profile.release]
panic = "abort"
debug = false
strip = true
lto = true
codegen-units = 1
