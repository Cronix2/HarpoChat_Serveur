[workspace]
resolver = "2"
members = ["crates/harpochat-core", "crates/harpochat-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
authors = ["HarpoChat contributors"]
repository = "https://github.com/Cronix2/HarpoChat_Serveur"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
ed25519-dalek = { version = "3", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
sphinx-packet = "0.8"
blake2 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
data-encoding = "2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
getrandom = "0.4"
thiserror = "2"
subtle = "2.6"
snow = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
# dev
tempfile = "3"
serde_json = "1"
hex = "0.4"
proptest = "1"

[profile.release]
panic = "abort"
debug = false
strip = true
lto = true
codegen-units = 1
